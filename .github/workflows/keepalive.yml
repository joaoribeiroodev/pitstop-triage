# O backend roda no plano gratuito do Render, que hiberna depois de 15 minutos sem acesso
# (a primeira requisição seguinte leva cerca de um minuto). Este ping mantém o serviço acordado.
# Defina a variável de repositório API_HEALTH_URL (Settings → Secrets and variables → Actions → Variables);
# sem ela o job não faz nada. Ao migrar para um plano pago, apague este arquivo.
name: Keepalive

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    if: ${{ vars.API_HEALTH_URL != '' }}
    steps:
      - name: Acorda o backend
        run: curl -fsS --retry 3 --retry-delay 20 --max-time 90 "${{ vars.API_HEALTH_URL }}"
